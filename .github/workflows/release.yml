name: release

# workflow_dispatch builds and verifies artifacts without publishing them.
# Pushing a v* tag builds the same artifacts, verifies them, creates a draft
# release, and publishes only after every asset check passes.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write
    runs-on: macos-latest
    env:
      MACOS_COMMUNITY_CERTIFICATE: ${{ secrets.MACOS_COMMUNITY_CERTIFICATE }}
      MACOS_COMMUNITY_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_COMMUNITY_CERTIFICATE_PASSWORD }}
      MACOS_COMMUNITY_SIGNING_IDENTITY: ${{ secrets.MACOS_COMMUNITY_SIGNING_IDENTITY }}
      MACOS_COMMUNITY_CERT_SHA1: ${{ secrets.MACOS_COMMUNITY_CERT_SHA1 }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add x86_64 target
        run: rustup target add x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-community-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate signing secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            MACOS_COMMUNITY_CERTIFICATE \
            MACOS_COMMUNITY_CERTIFICATE_PASSWORD \
            MACOS_COMMUNITY_SIGNING_IDENTITY \
            MACOS_COMMUNITY_CERT_SHA1 \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Import community code-signing certificate
        id: community-signing
        shell: bash
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/ttree-community.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate_path="$RUNNER_TEMP/ttree-community.p12"
          certificate_pem="$RUNNER_TEMP/ttree-community.pem"

          echo "::add-mask::$keychain_password"
          printf '%s' "$MACOS_COMMUNITY_CERTIFICATE" | base64 --decode > "$certificate_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_COMMUNITY_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          security find-certificate \
            -c "$MACOS_COMMUNITY_SIGNING_IDENTITY" \
            -p \
            "$keychain_path" > "$certificate_pem"

          actual_sha1="$(openssl x509 -in "$certificate_pem" -noout -fingerprint -sha1 | sed 's/.*=//; s/://g')"
          expected_sha1="$(printf '%s' "$MACOS_COMMUNITY_CERT_SHA1" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [[ "$actual_sha1" != "$expected_sha1" ]]; then
            echo "::error::Imported certificate fingerprint does not match MACOS_COMMUNITY_CERT_SHA1"
            exit 1
          fi

          sudo security add-trusted-cert \
            -d \
            -r trustRoot \
            -p codeSign \
            -k /Library/Keychains/System.keychain \
            "$certificate_pem"

          existing_keychains=()
          while IFS= read -r keychain; do
            existing_keychains+=("$keychain")
          done < <(security list-keychains -d user | sed 's/^[[:space:]]*"//; s/"$//')
          security list-keychains -d user -s "$keychain_path" "${existing_keychains[@]}"
          security find-identity -v -p codesigning "$keychain_path" | grep -F "$expected_sha1"

          echo "MACOS_COMMUNITY_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "certificate_pem=$certificate_pem" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$keychain_path" >> "$GITHUB_OUTPUT"

      - name: Resolve release metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' package.json)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            expected_tag="v$version"
            if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
              exit 1
            fi
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="v${version}-ci-${GITHUB_RUN_NUMBER}"
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Build and package community-signed macOS app
        run: ./scripts/package-macos-community.sh universal-apple-darwin "$GITHUB_RUN_NUMBER"

      - name: Verify final app signature
        run: |
          app_path="src-tauri/target/universal-apple-darwin/release/bundle/macos/TTREE.app"
          ./scripts/verify-macos-community-signature.sh \
            "$app_path" \
            "com.samwstu.ttree" \
            "$MACOS_COMMUNITY_SIGNING_IDENTITY" \
            "$MACOS_COMMUNITY_CERT_SHA1"

      - name: Generate updater manifest
        run: |
          ./scripts/generate-latest-json.sh \
            "src-tauri/target/community-release" \
            "$RELEASE_TAG" \
            "$GITHUB_REPOSITORY"

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: community-macos-${{ github.run_id }}
          path: src-tauri/target/community-release/
          if-no-files-found: error
          retention-days: 7

      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_dir="src-tauri/target/community-release"
          gh release create "$GITHUB_REF_NAME" \
            "$release_dir/TTREE_${APP_VERSION}_universal.dmg" \
            "$release_dir/TTREE_universal.app.tar.gz" \
            "$release_dir/TTREE_universal.app.tar.gz.sig" \
            "$release_dir/latest.json" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "TTREE $GITHUB_REF_NAME" \
            --notes-file scripts/community-release-notes.md

      - name: Verify draft Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for expected in \
            "TTREE_${APP_VERSION}_universal.dmg" \
            "TTREE_universal.app.tar.gz" \
            "TTREE_universal.app.tar.gz.sig" \
            "latest.json"
          do
            if ! grep -Fqx "$expected" <<< "$assets"; then
              echo "::error::Draft release is missing $expected"
              exit 1
            fi
          done

      - name: Publish verified Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Clean up signing keychain
        if: always() && steps.community-signing.outputs.keychain_path != ''
        shell: bash
        run: |
          security delete-keychain "${{ steps.community-signing.outputs.keychain_path }}" 2>/dev/null || true
