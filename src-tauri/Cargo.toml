[package]
name = "ttree"
version = "0.1.5"
description = "轻量 macOS AI 翻译器"
authors = ["you"]
edition = "2021"

[lib]
name = "ttree_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
window-vibrancy = "0.7"
reqwest = { version = "0.12", features = ["json", "stream", "cookies"] }
futures-util = "0.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
urlencoding = "2"
url = "2"
tempfile = "3"

# macOS 原生 OCR（Apple Vision）
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
# macOS Keychain —— 存放 API key，避免明文落盘
security-framework = "3"
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-core-image = { version = "0.3", features = ["CIContext"] }
objc2-core-ml = { version = "0.3", features = ["MLCPUComputeDevice", "MLComputeDeviceProtocol"] }
objc2-image-io = { version = "0.3", features = ["CGImageSource"] }
objc2-app-kit = { version = "0.3", features = [
    "NSPasteboard",
    "NSPasteboardItem",
] }
objc2-core-graphics = { version = "0.3", features = [
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGEvent",
    "CGEventTypes",
    "CGRemoteOperation",
    "CGImage",
] }
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSValue",
] }
objc2-vision = { version = "0.3", features = [
    "objc2-core-graphics",
    "objc2-core-ml",
    "VNRequest",
    "VNRecognizeTextRequest",
    "VNObservation",
    "VNRequestHandler",
    "VNTypes",
] }
