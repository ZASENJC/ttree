[package]
name = "ttree-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "ttree"
path = "src/main.rs"

[dependencies]
ttree-core = { path = "../ttree-core" }
ttree-storage = { path = "../ttree-storage" }
ttree-platform-macos = { path = "../ttree-platform-macos" }
ttree-ocr = { path = "../ttree-ocr" }
ttree-translate = { path = "../ttree-translate" }
ttree-ai = { path = "../ttree-ai" }
anyhow.workspace = true
global-hotkey.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-core-foundation.workspace = true
objc2-foundation.workspace = true
objc2-quartz-core.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
lucide-icons = { version = "=1.39.0", default-features = false }

windows = { workspace = true, features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_UI_WindowsAndMessaging"] }
